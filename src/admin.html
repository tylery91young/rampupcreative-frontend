<div class="wrap admin-shell">

  <!-- login -->
  <form class="admin-login" id="admin-login" hidden>
    <h1>Inquiry inbox</h1>
    <p>Enter the admin password to view contact form submissions.</p>
    <div class="field">
      <label for="admin-pw">Password</label>
      <input id="admin-pw" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn--block" type="submit">Sign in</button>
    <p class="form-status err" id="admin-login-status" role="status" aria-live="polite"></p>
  </form>

  <!-- inbox -->
  <div id="admin-app" hidden>
    <div class="admin-bar">
      <h1>Inquiry inbox</h1>
      <div class="admin-tabs" id="admin-tabs">
        <button data-filter="new" class="is-active">New</button>
        <button data-filter="replied">Replied</button>
        <button data-filter="spam">Spam</button>
        <button data-filter="all">All</button>
      </div>
      <button class="sub-actions" id="admin-logout" style="border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer">Sign out</button>
    </div>
    <p class="admin-count" id="admin-count"></p>
    <div class="sub-list" id="admin-list"></div>
  </div>

</div>
