<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ meta_description }}">
<link rel="canonical" href="{{ canonical }}">
{{ noindex }}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ meta_description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="{{ media_base }}" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{ site_name }}",
  "description": "{{ description }}",
  "url": "{{ site_url }}",
  "email": "{{ contact_email }}",
  "telephone": "{{ contact_phone_display }}",
  "areaServed": "Utah County, Utah",
  "address": { "@type": "PostalAddress", "addressLocality": "Provo", "addressRegion": "UT", "addressCountry": "US" },
  "sameAs": ["{{ instagram_url }}", "{{ youtube_url }}"]
}
</script>
{{ head_extra }}
</head>
<body class="{{ body_class }}">
<a class="skip-link" href="#main">Skip to content</a>
{{ header }}
<main id="main">
{{ content }}
</main>
{{ footer }}
<script src="/assets/main.js" defer></script>
{{ page_scripts }}
</body>
</html>
